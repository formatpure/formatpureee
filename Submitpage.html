<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write Something</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f3ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:480px;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h2{font-size:22px;margin-bottom:6px}.sub{color:#777;font-size:13px;margin-bottom:18px}
textarea{width:100%;height:140px;padding:14px;border:1.5px solid #ddd;border-radius:12px;outline:none;resize:none}
textarea:focus{border-color:#6c5ce7}
.btn{width:100%;padding:13px;margin-top:14px;background:#6c5ce7;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
#msg{font-size:13px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>Write your message</h2>
<p class="sub">Your message will be sent to admin securely.</p>
<textarea id="text" placeholder="Type something here..."></textarea>
<button class="btn" id="saveBtn">Save</button>
<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentEmail = "guest";
onAuthStateChanged(auth, u=>{ if(u) currentEmail = u.email; });

document.getElementById('saveBtn').onclick = async ()=>{
  const val = document.getElementById('text').value.trim();
  if(!val) return alert("Write something");
  document.getElementById('msg').textContent="Saving...";
  try{
    await addDoc(collection(db, "secret_notes"), {
      message: val,
      from: currentEmail,
      time: serverTimestamp()
    });
    document.getElementById('text').value="";
    document.getElementById('msg').textContent="✅ Saved! Admin will see it. You can't see it again.";
    document.getElementById('msg').style.color="green";
  }catch(e){
    document.getElementById('msg').textContent="❌ "+e.message;
  }
};
</script>
</body>
</html>
