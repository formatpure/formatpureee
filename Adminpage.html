<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Secret Notes</title>
<style>
body{font-family:sans-serif;background:#f6f7fb;padding:20px}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="top"><h2>All Secret Messages (Only you)</h2><button id="logout">Logout</button></div>
<div id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// CHANGE THIS TO YOUR GMAIL - only you can see
const MY_EMAIL = "youradmin@gmail.com";

onAuthStateChanged(auth, (user)=>{
  if(!user || user.email !== MY_EMAIL){
    alert("Not admin! Login with admin gmail");
    window.location.href="index.html";
    return;
  }
  const q = query(collection(db,"secret_notes"), orderBy("time","desc"));
  onSnapshot(q, (snap)=>{
    let html="";
    snap.forEach(doc=>{
      const d=doc.data();
      html+=`<div class="card"><b>${d.from}</b><br><br>${d.message}<br><small>${d.time?.toDate().toLocaleString()||''}</small></div>`;
    });
    document.getElementById('list').innerHTML = html || "No messages yet";
  });
});

document.getElementById('logout').onclick=()=>{ signOut(auth).then(()=>location.href="index.html"); };
</script>
</body>
</html>
